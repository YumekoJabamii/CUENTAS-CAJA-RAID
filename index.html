<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAID — Panel de caja</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-app:      #0e0e0c;
  --bg-sidebar:  #141412;
  --bg-main:     #1a1a18;
  --bg-card:     #222220;
  --bg-card-alt: #1e1e1c;
  --bg-input:    #2a2a28;
  --text-1:      #f0ede6;
  --text-2:      #9e9b94;
  --text-3:      #5c5b57;
  --border:      rgba(255,255,255,0.07);
  --border-md:   rgba(255,255,255,0.13);
  --green:       #4ade80;
  --green-dim:   rgba(74,222,128,0.12);
  --green-text:  #4ade80;
  --red:         #f87171;
  --red-dim:     rgba(248,113,113,0.12);
  --red-text:    #f87171;
  --amber:       #fbbf24;
  --amber-dim:   rgba(251,191,36,0.12);
  --blue:        #60a5fa;
  --blue-dim:    rgba(96,165,250,0.12);
  --accent:      #4ade80;
  --radius-sm:   6px;
  --radius-md:   9px;
  --radius-lg:   12px;
  --sidebar-w:   210px;
}

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg-app);
  color: var(--text-1);
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  min-height: 100vh;
}

/* ── SIDEBAR ─────────────────────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--bg-sidebar);
  border-right: 0.5px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 12px;
  position: fixed;
  top: 0; left: 0; bottom: 0;
}

.sidebar-logo {
  font-size: 17px;
  font-weight: 600;
  color: var(--text-1);
  letter-spacing: -0.3px;
  padding: 4px 10px 20px;
  border-bottom: 0.5px solid var(--border);
  margin-bottom: 12px;
}
.sidebar-logo span {
  font-size: 11px;
  font-weight: 400;
  color: var(--text-3);
  display: block;
  margin-top: 1px;
  letter-spacing: 0;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: var(--radius-md);
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.12s;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
  margin-bottom: 2px;
}
.nav-item i { font-size: 16px; flex-shrink: 0; }
.nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text-1); }
.nav-item.active { background: rgba(74,222,128,0.1); color: var(--green); }
.nav-item.active i { color: var(--green); }

.sidebar-footer {
  margin-top: auto;
  padding-top: 12px;
  border-top: 0.5px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sidebar-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: var(--radius-md);
  font-size: 12px;
  color: var(--text-2);
  cursor: pointer;
  background: transparent;
  border: none;
  width: 100%;
  text-align: left;
  transition: all 0.12s;
}
.sidebar-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-1); }
.sidebar-btn i { font-size: 15px; }

/* ── MAIN ────────────────────────────────────────────────────────────────── */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  background: var(--bg-main);
  min-height: 100vh;
  padding: 28px 32px 48px;
  max-width: 860px;
}

.view { display: none; }
.view.active { display: block; }

/* ── TOPBAR dentro del main ───────────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.topbar-title { font-size: 18px; font-weight: 500; color: var(--text-1); }
.topbar-sub   { font-size: 12px; color: var(--text-3); margin-top: 2px; }

.month-nav { display: flex; align-items: center; gap: 8px; }
.month-btn {
  width: 30px; height: 30px;
  border-radius: var(--radius-sm);
  border: 0.5px solid var(--border-md);
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: all 0.12s;
}
.month-btn:hover { background: rgba(255,255,255,0.06); color: var(--text-1); }

/* ── NETO CARD (hero) ─────────────────────────────────────────────────────── */
.neto-card {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.neto-main label { font-size: 11px; color: var(--text-3); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
.neto-main .amount { font-size: 32px; font-weight: 500; color: var(--green); letter-spacing: -0.5px; }
.neto-main .amount.neg { color: var(--red); }
.neto-secondary { text-align: right; }
.neto-secondary label { font-size: 11px; color: var(--text-3); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
.neto-secondary .amount { font-size: 20px; font-weight: 500; color: var(--red); }

/* ── STAT GRID ───────────────────────────────────────────────────────────── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 24px;
}
.stat {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
}
.stat label { font-size: 11px; color: var(--text-3); display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
.stat .val { font-size: 18px; font-weight: 500; color: var(--text-1); }
.val.green { color: var(--green-text); }
.val.red   { color: var(--red-text); }

/* ── SECTION TITLE ───────────────────────────────────────────────────────── */
.section-title {
  font-size: 10px;
  font-weight: 500;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: 20px 0 8px;
}

/* ── COBRO ROWS ──────────────────────────────────────────────────────────── */
.cobros-list {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 8px;
}
.cobro-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 0.5px solid var(--border);
  transition: background 0.1s;
}
.cobro-row:last-child { border-bottom: none; }
.cobro-row.is-done { background: var(--green-dim); }

.check-btn {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--border-md);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  color: transparent;
  transition: all 0.15s;
}
.check-btn:hover { border-color: var(--green); }
.check-btn.done { background: var(--green-dim); border-color: var(--green); color: var(--green); }
.check-btn.pending { border-color: var(--red); }

.cobro-name { font-size: 14px; font-weight: 500; color: var(--text-1); }
.cobro-sub  { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.monto-pending { color: var(--red-text); font-weight: 500; font-size: 14px; }
.monto-done    { color: var(--green-text); font-weight: 500; font-size: 14px; }
.monto-ing     { color: var(--green-text); font-weight: 500; font-size: 14px; }

/* ── BADGES ──────────────────────────────────────────────────────────────── */
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: var(--radius-sm);
}
.badge.green { background: var(--green-dim);  color: var(--green); }
.badge.amber { background: var(--amber-dim);  color: var(--amber); }
.badge.blue  { background: var(--blue-dim);   color: var(--blue);  }
.badge.red   { background: var(--red-dim);    color: var(--red);   }

/* ── CARDS (clientes, etc) ───────────────────────────────────────────────── */
.card {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  margin-bottom: 8px;
}

.client-meta {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 0.5px solid var(--border);
}
.client-meta-item label { font-size: 11px; color: var(--text-3); display: block; margin-bottom: 3px; }
.client-meta-item span  { font-size: 13px; font-weight: 500; color: var(--text-1); }

/* ── FORMS ───────────────────────────────────────────────────────────────── */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 10px;
}

input[type=text], input[type=number], select {
  padding: 8px 11px;
  border: 0.5px solid var(--border-md);
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  color: var(--text-1);
  font-size: 13px;
  width: 100%;
  transition: border-color 0.12s;
  outline: none;
}
input::placeholder { color: var(--text-3); }
input:focus, select:focus { border-color: rgba(74,222,128,0.4); }
select option { background: var(--bg-card); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  background: rgba(255,255,255,0.06);
  border: 0.5px solid var(--border-md);
  color: var(--text-1);
  transition: all 0.12s;
}
.btn:hover { background: rgba(255,255,255,0.1); }

.btn-danger {
  background: transparent;
  border: none;
  color: var(--text-3);
  cursor: pointer;
  padding: 4px 6px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  display: flex; align-items: center;
  transition: all 0.12s;
}
.btn-danger:hover { color: var(--red); background: var(--red-dim); }

/* ── MISC ────────────────────────────────────────────────────────────────── */
.divider { height: 0.5px; background: var(--border); margin: 20px 0; }
.empty { padding: 20px; text-align: center; color: var(--text-3); font-size: 13px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.day-circle {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--bg-input);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.warning-text { font-size: 11px; color: var(--amber); margin-left: 6px; }

.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--bg-card);
  border: 0.5px solid var(--border-md);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  font-size: 13px;
  color: var(--text-2);
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.2s ease;
  pointer-events: none;
  z-index: 999;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.warn { border-color: rgba(251,191,36,0.3); color: var(--amber); }
.toast i { font-size: 15px; }

.backup-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-3);
  padding: 6px 10px;
  margin-top: 4px;
}
.backup-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    RAID
    <span>Panel de caja</span>
  </div>

  <button class="nav-item active" data-view="caja">
    <i class="ti ti-chart-bar"></i> Caja
  </button>
  <button class="nav-item" data-view="clientes">
    <i class="ti ti-users"></i> Clientes
  </button>
  <button class="nav-item" data-view="gastos">
    <i class="ti ti-receipt"></i> Gastos fijos
  </button>
  <button class="nav-item" data-view="calendario">
    <i class="ti ti-calendar"></i> Calendario
  </button>

  <div class="sidebar-footer">
    <button class="sidebar-btn" id="btn-export">
      <i class="ti ti-download"></i> Exportar datos
    </button>
    <label class="sidebar-btn" style="cursor:pointer;">
      <i class="ti ti-upload"></i> Importar datos
      <input type="file" id="input-import" accept=".json" style="display:none;">
    </label>
    <div class="backup-indicator">
      <div class="backup-dot" id="backup-dot"></div>
      <span id="backup-label">Guardado hace un momento</span>
    </div>
  </div>
<div class="toast" id="toast">
  <i class="ti ti-device-floppy"></i>
  <span id="toast-msg">Guardado automático</span>
</div>
</aside>

<!-- MAIN -->
<main class="main">

  <!-- ── CAJA ── -->
  <div id="view-caja" class="view active">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="caja-mes-label"></div>
        <div class="topbar-sub">Hacé click en el círculo para confirmar cobros y pagos</div>
      </div>
      <div class="month-nav">
        <button class="month-btn" id="mes-prev"><i class="ti ti-chevron-left"></i></button>
        <button class="month-btn" id="mes-next"><i class="ti ti-chevron-right"></i></button>
      </div>
    </div>

    <div class="neto-card">
      <div class="neto-main">
        <label>Neto proyectado</label>
        <div class="amount" id="neto-val">$0</div>
      </div>
      <div class="neto-secondary">
        <label>Pendiente de cobrar</label>
        <div class="amount" id="pendiente-val">$0</div>
      </div>
    </div>

    <div class="stat-grid" id="caja-stats"></div>

    <p class="section-title">Ingresos del mes</p>
    <div id="caja-ingresos"></div>

    <p class="section-title">Gastos fijos</p>
    <div id="caja-gastos"></div>

    <p class="section-title">Únicos este mes</p>
    <div id="caja-unicos"></div>
    <div class="card" style="margin-top:6px;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
        <select id="u-tipo" style="width:130px;flex-shrink:0;">
          <option value="ingreso">Cobro único</option>
          <option value="gasto">Gasto único</option>
        </select>
        <input type="text"   id="u-concepto" placeholder="Concepto" style="flex:1;min-width:120px;">
        <input type="number" id="u-monto"    placeholder="Monto ARS" style="width:120px;flex-shrink:0;">
      </div>
      <button class="btn" id="btn-agregar-unico"><i class="ti ti-plus"></i> Agregar al mes actual</button>
    </div>
  </div>

  <!-- ── CLIENTES ── -->
  <div id="view-clientes" class="view">
    <div class="topbar">
      <div class="topbar-title">Clientes</div>
    </div>
    <div id="lista-clientes"></div>
    <p class="section-title" style="margin-top:24px;">Agregar cliente</p>
    <div class="card">
      <div class="form-grid">
        <input type="text"   id="c-nombre"   placeholder="Nombre del cliente">
        <input type="text"   id="c-concepto" placeholder="Concepto (ej: soporte mensual)">
        <input type="number" id="c-monto"    placeholder="Monto mensual (ARS)">
        <input type="number" id="c-dia"      placeholder="Día de cobro (1-31)" min="1" max="31">
      </div>
      <div class="form-grid">
        <select id="c-factura">
          <option value="no">Sin factura</option>
          <option value="si">Con factura requerida</option>
        </select>
        <select id="c-estado">
          <option value="activo">Activo — soporte</option>
          <option value="desarrollo">En desarrollo</option>
          <option value="porCerrar">Por cerrar</option>
        </select>
      </div>
      <button class="btn" id="btn-agregar-cliente"><i class="ti ti-plus"></i> Agregar cliente</button>
    </div>
  </div>

  <!-- ── GASTOS ── -->
  <div id="view-gastos" class="view">
    <div class="topbar">
      <div class="topbar-title">Gastos fijos</div>
    </div>
    <div class="cobros-list" id="lista-gastos"></div>
    <p class="section-title" style="margin-top:20px;">Agregar gasto fijo</p>
    <div class="card">
      <div class="form-grid">
        <input type="text"   id="g-nombre" placeholder="Nombre (ej: Claude Max)">
        <input type="number" id="g-monto"  placeholder="Monto mensual (ARS)">
      </div>
      <button class="btn" id="btn-agregar-gasto"><i class="ti ti-plus"></i> Agregar gasto</button>
    </div>
  </div>

  <!-- ── CALENDARIO ── -->
  <div id="view-calendario" class="view">
    <div class="topbar">
      <div class="topbar-title">Calendario de cobros</div>
    </div>
    <div id="lista-calendario"></div>
  </div>

</main>

<script>
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

const DEFAULTS_CLIENTES = [
  { id:1, nombre:"Salomon Sellam",  concepto:"Soporte mensual — cursos",      monto:320000, dia:3,    factura:"no", estado:"activo" },
  { id:2, nombre:"Torrecillas",     concepto:"Soporte mensual",                monto:160000, dia:13,   factura:"si", estado:"activo" },
  { id:3, nombre:"Basileus",        concepto:"Soporte mensual (post-entrega)", monto:80000,  dia:null, factura:"no", estado:"desarrollo" },
  { id:4, nombre:"Landing Campana", concepto:"Anticipo 50%",                   monto:150000, dia:null, factura:"no", estado:"porCerrar" },
];
const DEFAULTS_GASTOS = [
  { id:1, nombre:"Claude Max", monto:120000 },
  { id:2, nombre:"Claude Pro", monto:24000  },
];

const _hoy = new Date();
let _mesCurrent = _hoy.getMonth();
let _yearCurrent = _hoy.getFullYear();

let state = {
  clientes:   JSON.parse(localStorage.getItem('raid_clientes') || 'null') || DEFAULTS_CLIENTES,
  gastos:     JSON.parse(localStorage.getItem('raid_gastos')   || 'null') || DEFAULTS_GASTOS,
  cobros:     JSON.parse(localStorage.getItem('raid_cobros')   || '{}'),
  unicos:     JSON.parse(localStorage.getItem('raid_unicos')   || '[]'),
  nextId:     parseInt(localStorage.getItem('raid_nextId')     || '10'),
};

function save() {
  localStorage.setItem('raid_clientes', JSON.stringify(state.clientes));
  localStorage.setItem('raid_gastos',   JSON.stringify(state.gastos));
  localStorage.setItem('raid_cobros',   JSON.stringify(state.cobros));
  localStorage.setItem('raid_unicos',   JSON.stringify(state.unicos));
  localStorage.setItem('raid_nextId',   state.nextId);
}

function getMes() {
  return { mes: _mesCurrent, year: _yearCurrent, key: `${_yearCurrent}-${_mesCurrent}` };
}

function cambiarMes(delta) {
  _mesCurrent += delta;
  if (_mesCurrent > 11) { _mesCurrent = 0;  _yearCurrent++; }
  if (_mesCurrent < 0)  { _mesCurrent = 11; _yearCurrent--; }
  renderCaja();
}

function fmt(n) { return '$' + Math.round(n).toLocaleString('es-AR'); }

function estadoBadge(e) {
  const map = { activo:['green','Activo'], desarrollo:['amber','En desarrollo'], porCerrar:['blue','Por cerrar'] };
  const [cls, txt] = map[e] || ['blue', e];
  return `<span class="badge ${cls}">${txt}</span>`;
}

// ── Navegación ────────────────────────────────────────────────────────────────
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    render();
  });
});

document.getElementById('mes-prev').addEventListener('click', () => cambiarMes(-1));
document.getElementById('mes-next').addEventListener('click', () => cambiarMes(1));

// ── Render caja ───────────────────────────────────────────────────────────────
function renderCaja() {
  const { mes, year, key } = getMes();
  document.getElementById('caja-mes-label').textContent = `${MESES[mes]} ${year}`;

  const activos = state.clientes.filter(c => c.estado === 'activo' && c.monto);
  const totalIngEsp = activos.reduce((a,c) => a + c.monto, 0);
  const totalIngCob = activos.filter(c => state.cobros[`${c.id}_${key}`]).reduce((a,c) => a + c.monto, 0);
  const totalGas    = state.gastos.reduce((a,g) => a + g.monto, 0);
  const unicosMes   = state.unicos.filter(u => u.key === key);
  const totalUnicoIng = unicosMes.filter(u => u.tipo === 'ingreso').reduce((a,u) => a + u.monto, 0);
  const totalUnicoGas = unicosMes.filter(u => u.tipo === 'gasto').reduce((a,u) => a + u.monto, 0);
  const neto        = (totalIngEsp + totalUnicoIng) - (totalGas + totalUnicoGas);
  const pendiente   = activos.filter(c => !state.cobros[`${c.id}_${key}`]).reduce((a,c) => a + c.monto, 0);

  const netoEl = document.getElementById('neto-val');
  netoEl.textContent = fmt(neto);
  netoEl.className = 'amount' + (neto < 0 ? ' neg' : '');
  document.getElementById('pendiente-val').textContent = fmt(pendiente);

  document.getElementById('caja-stats').innerHTML = `
    <div class="stat"><label>Ingresos esperados</label><div class="val">${fmt(totalIngEsp + totalUnicoIng)}</div></div>
    <div class="stat"><label>Cobrado</label><div class="val green">${fmt(totalIngCob)}</div></div>
    <div class="stat"><label>Gastos fijos</label><div class="val red">${fmt(totalGas + totalUnicoGas)}</div></div>
  `;

  const ingEl = document.getElementById('caja-ingresos');
  if (!activos.length) {
    ingEl.innerHTML = '<div class="empty">Sin clientes activos.</div>';
  } else {
    ingEl.innerHTML = '<div class="cobros-list">' + activos.map(c => {
      const k    = `${c.id}_${key}`;
      const done = !!state.cobros[k];
      const fac  = c.factura === 'si' ? `<span class="warning-text"><i class="ti ti-file-text"></i> Factura req.</span>` : '';
      return `<div class="cobro-row ${done?'is-done':''}">
        <button class="check-btn ${done?'done':'pending'}" data-key="${k}">${done?'✓':''}</button>
        <div style="flex:1;">
          <div class="cobro-name">${c.nombre}${fac}</div>
          <div class="cobro-sub">${c.concepto} · ${c.dia?'Día '+c.dia:'Día a definir'}</div>
        </div>
        <span class="${done?'monto-done':'monto-pending'}">${fmt(c.monto)}</span>
      </div>`;
    }).join('') + '</div>';
    ingEl.querySelectorAll('.check-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.cobros[btn.dataset.key] = !state.cobros[btn.dataset.key];
        save(); renderCaja();
      });
    });
  }

  const gasEl = document.getElementById('caja-gastos');
  if (!state.gastos.length) {
    gasEl.innerHTML = '<div class="empty">Sin gastos fijos cargados.</div>';
  } else {
    gasEl.innerHTML = '<div class="cobros-list">' + state.gastos.map(g => {
      const k    = `g${g.id}_${key}`;
      const done = !!state.cobros[k];
      return `<div class="cobro-row ${done?'is-done':''}">
        <button class="check-btn ${done?'done':'pending'}" data-key="${k}">${done?'✓':''}</button>
        <div style="flex:1;">
          <div class="cobro-name">${g.nombre}</div>
          <div class="cobro-sub">Gasto fijo mensual</div>
        </div>
        <span class="${done?'monto-done':'monto-pending'}">${fmt(g.monto)}</span>
      </div>`;
    }).join('') + '</div>';
    gasEl.querySelectorAll('.check-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.cobros[btn.dataset.key] = !state.cobros[btn.dataset.key];
        save(); renderCaja();
      });
    });
  }

  const unicosEl = document.getElementById('caja-unicos');
  if (!unicosMes.length) {
    unicosEl.innerHTML = '<div class="empty">Sin cobros ni gastos únicos este mes.</div>';
  } else {
    unicosEl.innerHTML = '<div class="cobros-list">' + unicosMes.map(u => {
      const k     = `u${u.id}_${key}`;
      const done  = !!state.cobros[k];
      const isIng = u.tipo === 'ingreso';
      return `<div class="cobro-row ${done?'is-done':''}">
        <button class="check-btn ${done?'done':'pending'}" data-key="${k}">${done?'✓':''}</button>
        <div style="flex:1;">
          <div class="cobro-name">${u.concepto}</div>
          <div class="cobro-sub">${isIng?'Cobro único':'Gasto único'} — solo este mes</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="${isIng?'monto-ing':'monto-pending'}">${isIng?'+':'−'}${fmt(u.monto)}</span>
          <button class="btn-danger unico-del" data-uid="${u.id}"><i class="ti ti-trash"></i></button>
        </div>
      </div>`;
    }).join('') + '</div>';
    unicosEl.querySelectorAll('.check-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.cobros[btn.dataset.key] = !state.cobros[btn.dataset.key];
        save(); renderCaja();
      });
    });
    unicosEl.querySelectorAll('.unico-del').forEach(btn => {
      btn.addEventListener('click', () => {
        state.unicos = state.unicos.filter(u => u.id !== parseInt(btn.dataset.uid));
        save(); renderCaja();
      });
    });
  }
}

// ── Render clientes ───────────────────────────────────────────────────────────
function renderClientes() {
  const el = document.getElementById('lista-clientes');
  if (!state.clientes.length) { el.innerHTML = '<div class="empty">Sin clientes todavía.</div>'; return; }
  el.innerHTML = state.clientes.map(c => `
    <div class="card">
      <div class="row">
        <div>
          <div style="font-size:15px;font-weight:500;margin-bottom:4px;color:var(--text-1);">${c.nombre}</div>
          <div style="font-size:13px;color:var(--text-3);">${c.concepto}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          ${estadoBadge(c.estado)}
          <button class="btn-danger" data-id="${c.id}"><i class="ti ti-trash"></i></button>
        </div>
      </div>
      <div class="client-meta">
        <div class="client-meta-item"><label>Monto mensual</label><span>${c.monto ? fmt(c.monto) : '—'}</span></div>
        <div class="client-meta-item"><label>Día de cobro</label><span>${c.dia ? 'Día ' + c.dia : '—'}</span></div>
        <div class="client-meta-item"><label>Factura</label><span>${c.factura === 'si' ? 'Requerida' : 'No'}</span></div>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.btn-danger').forEach(btn => {
    btn.addEventListener('click', () => {
      state.clientes = state.clientes.filter(c => c.id !== parseInt(btn.dataset.id));
      save(); render();
    });
  });
}

document.getElementById('btn-agregar-cliente').addEventListener('click', () => {
  const nombre   = document.getElementById('c-nombre').value.trim();
  const concepto = document.getElementById('c-concepto').value.trim();
  const monto    = parseFloat(document.getElementById('c-monto').value) || 0;
  const dia      = parseInt(document.getElementById('c-dia').value) || null;
  const factura  = document.getElementById('c-factura').value;
  const estado   = document.getElementById('c-estado').value;
  if (!nombre) return;
  state.clientes.push({ id: state.nextId++, nombre, concepto, monto, dia, factura, estado });
  save(); render();
  ['c-nombre','c-concepto','c-monto','c-dia'].forEach(id => document.getElementById(id).value = '');
});

// ── Render gastos ─────────────────────────────────────────────────────────────
function renderGastos() {
  const el = document.getElementById('lista-gastos');
  if (!state.gastos.length) { el.innerHTML = '<div class="empty">Sin gastos fijos.</div>'; return; }
  el.innerHTML = state.gastos.map(g => `
    <div class="cobro-row">
      <div style="flex:1;">
        <div class="cobro-name">${g.nombre}</div>
        <div class="cobro-sub">Gasto fijo mensual</div>
      </div>
      <span style="font-weight:500;font-size:14px;color:var(--text-1);">${fmt(g.monto)}</span>
      <button class="btn-danger" data-id="${g.id}"><i class="ti ti-trash"></i></button>
    </div>
  `).join('');
  el.querySelectorAll('.btn-danger').forEach(btn => {
    btn.addEventListener('click', () => {
      state.gastos = state.gastos.filter(g => g.id !== parseInt(btn.dataset.id));
      save(); render();
    });
  });
}

document.getElementById('btn-agregar-gasto').addEventListener('click', () => {
  const nombre = document.getElementById('g-nombre').value.trim();
  const monto  = parseFloat(document.getElementById('g-monto').value) || 0;
  if (!nombre || !monto) return;
  state.gastos.push({ id: state.nextId++, nombre, monto });
  save(); render();
  document.getElementById('g-nombre').value = '';
  document.getElementById('g-monto').value  = '';
});

// ── Render calendario ─────────────────────────────────────────────────────────
function renderCalendario() {
  const el = document.getElementById('lista-calendario');
  const conDia    = state.clientes.filter(c => c.dia && c.estado === 'activo').sort((a,b) => a.dia - b.dia);
  const sinDia    = state.clientes.filter(c => !c.dia && c.estado === 'desarrollo');
  const porCerrar = state.clientes.filter(c => c.estado === 'porCerrar');

  let html = '';
  if (conDia.length) {
    html += '<div class="cobros-list" style="margin-bottom:8px;">';
    conDia.forEach(c => {
      const facAviso = c.factura === 'si'
        ? `<span class="warning-text"><i class="ti ti-file-text"></i> Emitir factura día ${c.dia - 2}</span>`
        : '';
      html += `<div class="cobro-row">
        <div class="day-circle">${c.dia}</div>
        <div style="flex:1;">
          <div class="cobro-name">${c.nombre} ${facAviso}</div>
          <div class="cobro-sub">${c.concepto}</div>
        </div>
        <span style="font-weight:500;font-size:14px;color:var(--text-1);">${fmt(c.monto)}</span>
      </div>`;
    });
    html += '</div>';
  }

  if (sinDia.length || porCerrar.length) {
    html += `<p class="section-title" style="margin-top:16px;">Sin fecha fija</p>`;
    html += '<div class="cobros-list">';
    [...sinDia, ...porCerrar].forEach(c => {
      html += `<div class="cobro-row">
        <div class="day-circle" style="font-size:10px;">—</div>
        <div style="flex:1;">
          <div class="cobro-name">${c.nombre} ${estadoBadge(c.estado)}</div>
          <div class="cobro-sub">${c.concepto}</div>
        </div>
        <span style="font-weight:500;font-size:14px;color:var(--text-1);">${c.monto ? fmt(c.monto) : '—'}</span>
      </div>`;
    });
    html += '</div>';
  }

  if (!html) html = '<div class="empty">Agregá clientes para ver el calendario.</div>';
  el.innerHTML = html;
}

// ── Únicos ────────────────────────────────────────────────────────────────────
document.getElementById('btn-agregar-unico').addEventListener('click', () => {
  const tipo     = document.getElementById('u-tipo').value;
  const concepto = document.getElementById('u-concepto').value.trim();
  const monto    = parseFloat(document.getElementById('u-monto').value) || 0;
  if (!concepto || !monto) return;
  const { key } = getMes();
  state.unicos.push({ id: state.nextId++, tipo, concepto, monto, key });
  save(); renderCaja();
  document.getElementById('u-concepto').value = '';
  document.getElementById('u-monto').value    = '';
});

// ── Exportar / importar ───────────────────────────────────────────────────────
document.getElementById('btn-export').addEventListener('click', () => {
  const data = {
    clientes: state.clientes, gastos: state.gastos,
    cobros: state.cobros, unicos: state.unicos,
    nextId: state.nextId, exportado: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `raid-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('input-import').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.clientes || !data.gastos) { alert('Archivo inválido.'); return; }
      if (!confirm('Esto va a reemplazar todos los datos actuales. ¿Continuar?')) return;
      state.clientes = data.clientes || [];
      state.gastos   = data.gastos   || [];
      state.cobros   = data.cobros   || {};
      state.unicos   = data.unicos   || [];
      state.nextId   = data.nextId   || 10;
      save(); render();
      alert('Datos restaurados correctamente.');
    } catch(err) {
      alert('Error al leer el archivo.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ── Auto-guardado y recordatorio ─────────────────────────────────────────────
let _lastSaveTime = Date.now();
let _toastTimer = null;

function showToast(msg, warn) {
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toast-msg');
  toastMsg.textContent = msg;
  toast.className = 'toast' + (warn ? ' warn' : '');
  clearTimeout(_toastTimer);
  requestAnimationFrame(() => {
    toast.classList.add('show');
    _toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  });
}

function updateBackupLabel() {
  const el = document.getElementById('backup-label');
  const dot = document.getElementById('backup-dot');
  const diff = Math.floor((Date.now() - _lastSaveTime) / 1000);
  if (diff < 60) {
    el.textContent = 'Guardado hace ' + diff + 's';
    dot.style.background = 'var(--green)';
  } else {
    const mins = Math.floor(diff / 60);
    el.textContent = 'Hace ' + mins + ' min' + (mins > 1 ? 's' : '');
    dot.style.background = diff > 120 ? 'var(--amber)' : 'var(--green)';
  }
}

// Parchar save() para actualizar el indicador
const _origSave = save;
function save() {
  _origSave();
  _lastSaveTime = Date.now();
  updateBackupLabel();
}

// Auto-guardar cada 60 segundos
setInterval(() => {
  save();
  showToast('Guardado automático');
}, 60000);

// Actualizar el label cada 10 segundos
setInterval(updateBackupLabel, 10000);

// Recordatorio de exportar cada 30 minutos
let _exportReminder = 0;
setInterval(() => {
  _exportReminder++;
  if (_exportReminder >= 30) {
    _exportReminder = 0;
    showToast('Acordate de exportar un backup manual', true);
  }
}, 60000);

function render() { renderCaja(); renderClientes(); renderGastos(); renderCalendario(); }
render();
</script>
</body>
</html>
