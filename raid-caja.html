<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAID — Panel de caja</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f3;
  --bg-tertiary: #eeede8;
  --text-primary: #1a1a1a;
  --text-secondary: #666662;
  --text-hint: #999994;
  --border: rgba(0,0,0,0.12);
  --border-md: rgba(0,0,0,0.22);
  --success-bg: #d6f0e0;
  --success-fg: #1a6b3c;
  --danger-bg: #fdecec;
  --danger-fg: #7a1f1f;
  --warning-bg: #fef3cd;
  --warning-fg: #7a5200;
  --info-bg: #ddeeff;
  --info-fg: #174a7e;
  --radius-md: 8px;
  --radius-lg: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-primary: #1c1c1a;
    --bg-secondary: #252523;
    --bg-tertiary: #2e2e2b;
    --text-primary: #f0ede6;
    --text-secondary: #9e9b94;
    --text-hint: #666662;
    --border: rgba(255,255,255,0.1);
    --border-md: rgba(255,255,255,0.2);
    --success-bg: #0d3320;
    --success-fg: #6dd49a;
    --danger-bg: #3a0f0f;
    --danger-fg: #f09595;
    --warning-bg: #3a2600;
    --warning-fg: #fac775;
    --info-bg: #0c2440;
    --info-fg: #85b7eb;
  }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.5;
}

.app-shell {
  max-width: 760px;
  margin: 0 auto;
  padding: 1.5rem 1rem 4rem;
}

.app-header {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 1.5rem;
}
.app-header h1 { font-size: 20px; font-weight: 500; }
.app-header span { font-size: 13px; color: var(--text-secondary); }

nav.tabs {
  display: flex;
  gap: 4px;
  padding-bottom: 1.25rem;
  border-bottom: 0.5px solid var(--border);
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}
nav.tabs button {
  padding: 6px 14px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  background: transparent;
  border: 0.5px solid transparent;
  color: var(--text-secondary);
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
nav.tabs button:hover { background: var(--bg-secondary); color: var(--text-primary); }
nav.tabs button.active { background: var(--bg-secondary); border-color: var(--border-md); color: var(--text-primary); }

.view { display: none; }
.view.active { display: block; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 1.5rem;
}
.stat {
  background: var(--bg-secondary);
  border-radius: var(--radius-md);
  padding: 14px 16px;
}
.stat label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
.stat .val { font-size: 20px; font-weight: 500; }
.val.green { color: var(--success-fg); }
.val.red   { color: var(--danger-fg); }

.card {
  background: var(--bg-primary);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem 1.25rem;
  margin-bottom: 10px;
}

.section-title {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 1.5rem 0 10px;
}

.cobro-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 0.5px solid var(--border);
}
.cobro-row:last-child { border-bottom: none; }

.check-btn {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--border-md);
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  background: transparent;
  font-size: 11px;
}
.check-btn.done {
  background: var(--success-bg);
  border-color: var(--success-fg);
  color: var(--success-fg);
}
.check-btn.pending {
  border-color: var(--danger-fg);
}

.monto-pending { color: var(--danger-fg); font-weight: 500; }
.monto-done    { color: var(--success-fg); font-weight: 500; }

.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 500;
  padding: 3px 9px;
  border-radius: var(--radius-md);
}
.badge.green   { background: var(--success-bg); color: var(--success-fg); }
.badge.amber   { background: var(--warning-bg); color: var(--warning-fg); }
.badge.blue    { background: var(--info-bg);    color: var(--info-fg);    }
.badge.red     { background: var(--danger-bg);  color: var(--danger-fg);  }

.month-nav {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 1.5rem;
}
.month-nav button {
  background: var(--bg-primary);
  border: 0.5px solid var(--border-md);
  border-radius: var(--radius-md);
  padding: 6px 12px;
  cursor: pointer;
  color: var(--text-primary);
  font-size: 14px;
  transition: background 0.12s;
}
.month-nav button:hover { background: var(--bg-secondary); }
.month-label { font-size: 16px; font-weight: 500; flex: 1; }

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}
@media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }

input[type=text], input[type=number], select {
  padding: 8px 10px;
  border: 0.5px solid var(--border-md);
  border-radius: var(--radius-md);
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 13px;
  width: 100%;
  transition: border-color 0.12s;
}
input:focus, select:focus { outline: none; border-color: var(--text-secondary); }

.btn {
  background: var(--bg-secondary);
  border: 0.5px solid var(--border-md);
  border-radius: var(--radius-md);
  padding: 8px 16px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text-primary);
  font-weight: 500;
  transition: all 0.12s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { background: var(--bg-tertiary); }

.btn-danger {
  background: transparent;
  border: none;
  color: var(--danger-fg);
  cursor: pointer;
  font-size: 16px;
  padding: 4px 6px;
  border-radius: var(--radius-md);
  transition: background 0.12s;
  display: flex;
  align-items: center;
}
.btn-danger:hover { background: var(--danger-bg); }

.day-circle {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--bg-secondary);
  font-size: 12px;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--text-secondary);
}

.divider { height: 0.5px; background: var(--border); margin: 1.25rem 0; }
.empty { text-align: center; padding: 2rem; color: var(--text-secondary); font-size: 14px; }

.client-meta {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 0.5px solid var(--border);
}
.client-meta-item label { font-size: 11px; color: var(--text-secondary); display: block; }
.client-meta-item span  { font-size: 14px; font-weight: 500; }

.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.warning-text { font-size: 12px; color: var(--warning-fg); margin-left: 6px; }
</style>
</head>
<body>
<div class="app-shell">

  <div class="app-header">
    <h1>RAID</h1>
    <span>Panel de caja</span>
  </div>

  <nav class="tabs">
    <button class="active" data-view="caja"><i class="ti ti-chart-bar"></i> Caja</button>
    <button data-view="clientes"><i class="ti ti-users"></i> Clientes</button>
    <button data-view="gastos"><i class="ti ti-receipt"></i> Gastos fijos</button>
    <button data-view="calendario"><i class="ti ti-calendar"></i> Calendario</button>
  </nav>

  <!-- CAJA -->
  <div id="view-caja" class="view active">
    <div class="month-nav">
      <button id="mes-prev"><i class="ti ti-chevron-left"></i></button>
      <span class="month-label" id="caja-mes-label"></span>
      <button id="mes-next"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="stat-grid" id="caja-stats"></div>
    <p class="section-title">Ingresos del mes</p>
    <div id="caja-ingresos"></div>
    <div class="divider"></div>
    <p class="section-title">Gastos del mes</p>
    <div id="caja-gastos"></div>
  </div>

  <!-- CLIENTES -->
  <div id="view-clientes" class="view">
    <p class="section-title">Clientes activos</p>
    <div id="lista-clientes"></div>
    <p class="section-title" style="margin-top:2rem;">Agregar cliente</p>
    <div class="card">
      <div class="form-grid">
        <input type="text"   id="c-nombre"   placeholder="Nombre del cliente">
        <input type="text"   id="c-concepto" placeholder="Concepto (ej: soporte mensual)">
        <input type="number" id="c-monto"    placeholder="Monto mensual (ARS)">
        <input type="number" id="c-dia"      placeholder="Día de cobro (1-31)" min="1" max="31">
      </div>
      <div class="form-grid">
        <select id="c-factura">
          <option value="no">Sin factura</option>
          <option value="si">Con factura requerida</option>
        </select>
        <select id="c-estado">
          <option value="activo">Activo — soporte</option>
          <option value="desarrollo">En desarrollo</option>
          <option value="porCerrar">Por cerrar</option>
        </select>
      </div>
      <button class="btn" id="btn-agregar-cliente"><i class="ti ti-plus"></i> Agregar cliente</button>
    </div>
  </div>

  <!-- GASTOS -->
  <div id="view-gastos" class="view">
    <p class="section-title">Gastos fijos mensuales</p>
    <div class="card"><div id="lista-gastos"></div></div>
    <p class="section-title" style="margin-top:1.5rem;">Agregar gasto fijo</p>
    <div class="card">
      <div class="form-grid">
        <input type="text"   id="g-nombre" placeholder="Nombre (ej: Claude Max)">
        <input type="number" id="g-monto"  placeholder="Monto mensual (ARS)">
      </div>
      <button class="btn" id="btn-agregar-gasto"><i class="ti ti-plus"></i> Agregar gasto</button>
    </div>
  </div>

  <!-- CALENDARIO -->
  <div id="view-calendario" class="view">
    <p class="section-title">Cobros y pagos por día del mes</p>
    <div id="lista-calendario"></div>
  </div>

</div>

<script>
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

const DEFAULTS_CLIENTES = [
  { id:1, nombre:"Salomon Sellam",  concepto:"Soporte mensual — cursos",      monto:320000, dia:3,    factura:"no", estado:"activo" },
  { id:2, nombre:"Torrecillas",     concepto:"Soporte mensual",                monto:160000, dia:13,   factura:"si", estado:"activo" },
  { id:3, nombre:"Basileus",        concepto:"Soporte mensual (post-entrega)", monto:80000,  dia:null, factura:"no", estado:"desarrollo" },
  { id:4, nombre:"Landing Campana", concepto:"Anticipo 50%",                   monto:150000, dia:null, factura:"no", estado:"porCerrar" },
];
const DEFAULTS_GASTOS = [
  { id:1, nombre:"Claude Max", monto:120000 },
  { id:2, nombre:"Claude Pro", monto:24000  },
];

let state = {
  clientes:   JSON.parse(localStorage.getItem('raid_clientes') || 'null') || DEFAULTS_CLIENTES,
  gastos:     JSON.parse(localStorage.getItem('raid_gastos')   || 'null') || DEFAULTS_GASTOS,
  cobros:     JSON.parse(localStorage.getItem('raid_cobros')   || '{}'),
  nextId:     parseInt(localStorage.getItem('raid_nextId')     || '10'),
  mesOffset:  0,
};

function save() {
  localStorage.setItem('raid_clientes', JSON.stringify(state.clientes));
  localStorage.setItem('raid_gastos',   JSON.stringify(state.gastos));
  localStorage.setItem('raid_cobros',   JSON.stringify(state.cobros));
  localStorage.setItem('raid_nextId',   state.nextId);
}

function getMes() {
  const d = new Date();
  const totalMes = d.getMonth() + state.mesOffset;
  const mes = ((totalMes % 12) + 12) % 12;
  const year = d.getFullYear() + Math.floor(totalMes / 12);
  return { mes, year, key: `${year}-${mes}` };
}

function fmt(n) { return '$' + Math.round(n).toLocaleString('es-AR'); }

function estadoBadge(e) {
  const map = { activo:['green','Activo'], desarrollo:['amber','En desarrollo'], porCerrar:['blue','Por cerrar'] };
  const [cls, txt] = map[e] || ['blue', e];
  return `<span class="badge ${cls}">${txt}</span>`;
}

// ── Navegación ────────────────────────────────────────────────────────────────
document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    render();
  });
});

document.getElementById('mes-prev').addEventListener('click', () => { state.mesOffset--; render(); });
document.getElementById('mes-next').addEventListener('click', () => { state.mesOffset++; render(); });

// ── Render caja ───────────────────────────────────────────────────────────────
function renderCaja() {
  const { mes, year, key } = getMes();
  document.getElementById('caja-mes-label').textContent = `${MESES[mes]} ${year}`;

  const activos = state.clientes.filter(c => c.estado === 'activo' && c.monto);
  const totalIngEsp = activos.reduce((a,c) => a + c.monto, 0);
  const totalIngCob = activos.filter(c => state.cobros[`${c.id}_${key}`]).reduce((a,c) => a + c.monto, 0);
  const totalGas    = state.gastos.reduce((a,g) => a + g.monto, 0);
  const neto        = totalIngEsp - totalGas;

  document.getElementById('caja-stats').innerHTML = `
    <div class="stat"><label>Ingresos esperados</label><div class="val">${fmt(totalIngEsp)}</div></div>
    <div class="stat"><label>Cobrado</label><div class="val green">${fmt(totalIngCob)}</div></div>
    <div class="stat"><label>Gastos fijos</label><div class="val red">${fmt(totalGas)}</div></div>
    <div class="stat"><label>Neto mensual</label><div class="val ${neto>=0?'green':'red'}">${fmt(neto)}</div></div>
  `;

  const ingEl = document.getElementById('caja-ingresos');
  if (!activos.length) {
    ingEl.innerHTML = '<div class="empty">Sin clientes activos.</div>';
  } else {
    ingEl.innerHTML = '<div class="card">' + activos.map(c => {
      const k    = `${c.id}_${key}`;
      const done = !!state.cobros[k];
      const fac  = c.factura === 'si' ? `<span class="warning-text"><i class="ti ti-file-text"></i> Factura requerida</span>` : '';
      return `<div class="cobro-row">
        <button class="check-btn ${done?'done':'pending'}" data-key="${k}" title="${done?'Marcar como pendiente':'Marcar como cobrado'}">${done?'✓':''}</button>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:500;">${c.nombre}${fac}</div>
          <div style="font-size:12px;color:var(--text-secondary);">${c.concepto} · ${c.dia?'Día '+c.dia:'Día a definir'}</div>
        </div>
        <span class="${done?'monto-done':'monto-pending'}">${fmt(c.monto)}</span>
      </div>`;
    }).join('') + '</div>';
    ingEl.querySelectorAll('.check-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.key;
        state.cobros[k] = !state.cobros[k];
        save(); renderCaja();
      });
    });
  }

  const gasEl = document.getElementById('caja-gastos');
  if (!state.gastos.length) {
    gasEl.innerHTML = '<div class="empty">Sin gastos fijos cargados.</div>';
  } else {
    gasEl.innerHTML = '<div class="card">' + state.gastos.map(g => {
      const k    = `g${g.id}_${key}`;
      const done = !!state.cobros[k];
      return `<div class="cobro-row">
        <button class="check-btn ${done?'done':'pending'}" data-key="${k}" title="${done?'Marcar como pendiente':'Marcar como pagado'}">${done?'✓':''}</button>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:500;">${g.nombre}</div>
          <div style="font-size:12px;color:var(--text-secondary);">Gasto fijo mensual</div>
        </div>
        <span class="${done?'monto-done':'monto-pending'}">${fmt(g.monto)}</span>
      </div>`;
    }).join('') + '</div>';
    gasEl.querySelectorAll('.check-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.key;
        state.cobros[k] = !state.cobros[k];
        save(); renderCaja();
      });
    });
  }
}

// ── Render clientes ───────────────────────────────────────────────────────────
function renderClientes() {
  const el = document.getElementById('lista-clientes');
  if (!state.clientes.length) { el.innerHTML = '<div class="empty">Sin clientes todavía.</div>'; return; }
  el.innerHTML = state.clientes.map(c => `
    <div class="card">
      <div class="row">
        <div>
          <div style="font-size:15px;font-weight:500;margin-bottom:4px;">${c.nombre}</div>
          <div style="font-size:13px;color:var(--text-secondary);">${c.concepto}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          ${estadoBadge(c.estado)}
          <button class="btn-danger" data-id="${c.id}" title="Eliminar cliente"><i class="ti ti-trash"></i></button>
        </div>
      </div>
      <div class="client-meta">
        <div class="client-meta-item"><label>Monto mensual</label><span>${c.monto ? fmt(c.monto) : '—'}</span></div>
        <div class="client-meta-item"><label>Día de cobro</label><span>${c.dia ? 'Día ' + c.dia : '—'}</span></div>
        <div class="client-meta-item"><label>Factura</label><span>${c.factura === 'si' ? 'Requerida' : 'No'}</span></div>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.btn-danger').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      state.clientes = state.clientes.filter(c => c.id !== id);
      save(); render();
    });
  });
}

document.getElementById('btn-agregar-cliente').addEventListener('click', () => {
  const nombre   = document.getElementById('c-nombre').value.trim();
  const concepto = document.getElementById('c-concepto').value.trim();
  const monto    = parseFloat(document.getElementById('c-monto').value) || 0;
  const dia      = parseInt(document.getElementById('c-dia').value) || null;
  const factura  = document.getElementById('c-factura').value;
  const estado   = document.getElementById('c-estado').value;
  if (!nombre) return;
  state.clientes.push({ id: state.nextId++, nombre, concepto, monto, dia, factura, estado });
  save(); render();
  ['c-nombre','c-concepto','c-monto','c-dia'].forEach(id => document.getElementById(id).value = '');
});

// ── Render gastos ─────────────────────────────────────────────────────────────
function renderGastos() {
  const el = document.getElementById('lista-gastos');
  if (!state.gastos.length) { el.innerHTML = '<div class="empty">Sin gastos fijos.</div>'; return; }
  el.innerHTML = state.gastos.map(g => `
    <div class="cobro-row">
      <div style="flex:1">
        <div style="font-size:14px;font-weight:500;">${g.nombre}</div>
        <div style="font-size:12px;color:var(--text-secondary);">Gasto fijo mensual</div>
      </div>
      <span style="font-weight:500;font-size:14px;">${fmt(g.monto)}</span>
      <button class="btn-danger" data-id="${g.id}" title="Eliminar gasto"><i class="ti ti-trash"></i></button>
    </div>
  `).join('');
  el.querySelectorAll('.btn-danger').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      state.gastos = state.gastos.filter(g => g.id !== id);
      save(); render();
    });
  });
}

document.getElementById('btn-agregar-gasto').addEventListener('click', () => {
  const nombre = document.getElementById('g-nombre').value.trim();
  const monto  = parseFloat(document.getElementById('g-monto').value) || 0;
  if (!nombre || !monto) return;
  state.gastos.push({ id: state.nextId++, nombre, monto });
  save(); render();
  document.getElementById('g-nombre').value = '';
  document.getElementById('g-monto').value  = '';
});

// ── Render calendario ─────────────────────────────────────────────────────────
function renderCalendario() {
  const el = document.getElementById('lista-calendario');
  const conDia    = state.clientes.filter(c => c.dia && c.estado === 'activo').sort((a,b) => a.dia - b.dia);
  const sinDia    = state.clientes.filter(c => !c.dia && c.estado === 'desarrollo');
  const porCerrar = state.clientes.filter(c => c.estado === 'porCerrar');

  let html = '';
  conDia.forEach(c => {
    const facAviso = c.factura === 'si'
      ? `<span class="warning-text" style="font-size:11px;"><i class="ti ti-file-text"></i> Emitir factura día ${c.dia - 2}</span>`
      : '';
    html += `<div class="card" style="margin-bottom:8px;">
      <div class="cobro-row" style="padding:0;">
        <div class="day-circle">${c.dia}</div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:500;">${c.nombre} ${facAviso}</div>
          <div style="font-size:12px;color:var(--text-secondary);">${c.concepto}</div>
        </div>
        <span style="font-weight:500;font-size:14px;">${fmt(c.monto)}</span>
      </div>
    </div>`;
  });

  if (sinDia.length || porCerrar.length) {
    html += `<p class="section-title" style="margin-top:1rem;">Sin fecha fija</p>`;
    [...sinDia, ...porCerrar].forEach(c => {
      html += `<div class="card" style="margin-bottom:8px;">
        <div class="cobro-row" style="padding:0;">
          <div class="day-circle" style="font-size:10px;">—</div>
          <div style="flex:1;">
            <div style="font-size:14px;font-weight:500;">${c.nombre} ${estadoBadge(c.estado)}</div>
            <div style="font-size:12px;color:var(--text-secondary);">${c.concepto}</div>
          </div>
          <span style="font-weight:500;font-size:14px;">${c.monto ? fmt(c.monto) : '—'}</span>
        </div>
      </div>`;
    });
  }

  if (!html) html = '<div class="empty">Agregá clientes para ver el calendario.</div>';
  el.innerHTML = html;
}

function render() { renderCaja(); renderClientes(); renderGastos(); renderCalendario(); }
render();
</script>
</body>
</html>
